name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Temporarily change package name for prebuild
        run: |
          sed -i 's/com.chronicle.app/com.chronicle.orbit.app/g' app.json
          echo "Changed package name to com.chronicle.orbit.app for prebuild"

      - name: Generate Android project
        run: npx expo prebuild --clean --no-install

      - name: Restore package name
        run: |
          sed -i 's/com.chronicle.orbit.app/com.chronicle.app/g' app.json
          echo "Restored package name to com.chronicle.app"

      - name: Rename package directory
        run: |
          mkdir -p android/app/src/main/java/com/chronicle/app
          cp -r android/app/src/main/java/com/chronicle/orbit/app/* android/app/src/main/java/com/chronicle/app/
          rm -rf android/app/src/main/java/com/chronicle/orbit
          echo "Renamed package directory"

      - name: Fix package declarations in source files
        run: |
          find android/app/src/main/java/com/chronicle/app -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/com\.chronicle\.orbit\.app/com.chronicle.app/g' {} +
          echo "Fixed package declarations"

      - name: Apply native module
        run: node plugins/apply-native-module.js

      - name: Fix package name in generated Android files
        run: |
          sed -i 's/com.chronicle.orbit.app/com.chronicle.app/g' android/app/build.gradle
          sed -i 's/com.chronicle.orbit.app/com.chronicle.app/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/com.chronicle.orbit.app/com.chronicle.app/g' android/settings.gradle
          sed -i 's/com.chronicle.orbit.app/com.chronicle.app/g' android/gradle.properties
          find android -type f -name "*.xml" -exec sed -i 's/com\.chronicle\.orbit\.app/com.chronicle.app/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/com\.chronicle\.orbit\.app/com.chronicle.app/g' {} +
          find android -type f -name "*.kt" -exec sed -i 's/com\.chronicle\.orbit\.app/com.chronicle.app/g' {} +
          find android -type f -name "*.java" -exec sed -i 's/com\.chronicle\.orbit\.app/com.chronicle.app/g' {} +
          echo "Fixed all package name references"

      - name: Verify custom native files
        run: |
          NATIVE_DIR="android/app/src/main/java/com/chronicle/app"
          REQUIRED_FILES=(
            "ChronicleUsagePackage.java"
            "ChronicleUsageModule.java"
            "TrackingStore.kt"
            "TrackingScheduler.kt"
            "UsageCollectionWorker.kt"
            "UsageSyncWorker.kt"
            "BootReceiver.kt"
          )

          echo "Checking custom native files..."
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$NATIVE_DIR/$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

          echo "Checking ChronicleUsagePackage is public..."
          if ! grep -q "^public class ChronicleUsagePackage" "$NATIVE_DIR/ChronicleUsagePackage.java"; then
            echo "ERROR: ChronicleUsagePackage is not public"
            exit 1
          fi

          echo "Checking package declaration..."
          if ! grep -q "^package com.chronicle.app;" "$NATIVE_DIR/ChronicleUsagePackage.java"; then
            echo "ERROR: Wrong package declaration"
            exit 1
          fi

          echo "Checking MainApplication.kt imports..."
          if ! grep -q "import com.chronicle.app.ChronicleUsagePackage" "$NATIVE_DIR/MainApplication.kt"; then
            echo "ERROR: MainApplication.kt missing import"
            exit 1
          fi

          echo "Checking MainApplication.kt registration count..."
          REG_COUNT=$(grep -c "add(ChronicleUsagePackage())" "$NATIVE_DIR/MainApplication.kt")
          if [ "$REG_COUNT" -ne 1 ]; then
            echo "ERROR: Expected 1 ChronicleUsagePackage registration, found $REG_COUNT"
            exit 1
          fi

          echo "Checking WorkManager dependency in build.gradle..."
          if ! grep -q "work-runtime" "android/app/build.gradle"; then
            echo "ERROR: WorkManager dependency missing from build.gradle"
            exit 1
          fi

          echo "All verifications passed!"

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK is standalone
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "APK path: $APK_PATH"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK size: $APK_SIZE"
          echo "Build type: Release"
          echo "JS bundle: Embedded in APK (release builds bundle JS during Gradle build)"
          echo "QR code required: NO"
          echo "Metro required: NO"
          echo "Expo Go required: NO"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
